services:
  backup:
    image: ghcr.io/karakosystems/karako-backup:1
    restart: unless-stopped
    environment:
      BACKUP_HOST: ${BACKUP_HOST}
      BACKUP_EXTRA_PATHS: /host-coolify
      BACKUP_EXCLUDES: /host-coolify/backups /host-coolify/restic
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      - /data/coolify:/host-coolify:ro
      - /data/coolify/restic/cache:/root/.cache/restic
      - /data/coolify/restic/state:/state
      - /data/coolify/restic/dumps:/dumps
