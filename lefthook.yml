pre-commit:
  parallel: true
  jobs:
    - name: shellcheck
      glob: "{bin/*,test/*.sh}"
      run: shellcheck {staged_files}
    - name: hadolint
      glob: Dockerfile
      run: hadolint Dockerfile
    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: actionlint

commit-msg:
  jobs:
    - name: conventional commit
      run: |
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' || {
          echo "commit subject must follow conventional commits: type(scope)?: description"
          exit 1
        }

pre-push:
  jobs:
    - name: integration suite
      run: docker build -q -t karako-backup:ci . > /dev/null && sh test/integration.sh karako-backup:ci
