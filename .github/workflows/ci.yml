name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: shellcheck hadolint actionlint
      - name: shellcheck
        run: shellcheck bin/* test/*.sh
      - name: hadolint
        run: hadolint Dockerfile
      - name: actionlint
        run: actionlint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build image
        run: docker build -t karako-backup:ci .
      - name: back up and restore Postgres, MariaDB and a volume
        run: sh test/integration.sh karako-backup:ci
